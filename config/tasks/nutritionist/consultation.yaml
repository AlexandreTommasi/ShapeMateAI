task_type: "consultation"
priority: 3
description: "Structured 18-question consultation to collect all data needed for personalized diet creation"

# Required context for this task
required_context:
  - user_profile
  - current_eating_habits
  - food_preferences
  - activity_level
  - practical_constraints
  - time_availability
  - cooking_capabilities
  - budget_considerations

# Required tools
tools_required:
  - llm_direct
  - conversation_tracker
  - data_extractor

# Task configurations
max_iterations: 20
timeout_seconds: 600
success_criteria:
  eighteen_questions_completed: true
  all_areas_covered: true
  ready_for_diet_generation: true
  user_confirmation_received: true

# Specialized prompts for consultation phases
specialized_prompts:
  consultation_intro: |
    As an experienced nutritionist, conduct a professional consultation to collect all information needed for creating a personalized diet.
    
    **CONSULTATION STRUCTURE:**
    - Exactly 18 questions covering all essential areas
    - One question at a time, natural conversational style
    - Progress systematically through each area
    - End with summary and diet generation confirmation
    
    **COMMUNICATION RULES:**
    - Simple, direct language without special formatting
    - No asterisks, bold text, or excessive emojis
    - One question per response - never combine questions
    - DON'T repeat information already known from registration
    - Use registration data to personalize and contextualize questions
    - Don't judge current eating habits
    - Focus on understanding, not educating during data collection
    - Acknowledge information already provided (e.g., "Vi que seu objetivo é perda de peso...")

  consultation_flow: |
    CONSULTATION FLOW - 18 STRUCTURED QUESTIONS

    **IMPORTANTE: DADOS JÁ FORNECIDOS NO CADASTRO**
    - Nome, idade, sexo, peso, altura
    - Nível de atividade física
    - Objetivo principal (perda de peso, ganho de massa, manutenção)
    - Restrições alimentares e condições de saúde
    - NÃO pergunte essas informações novamente

    **PHASE 1: ROUTINE AND ACTIVITY (Questions 1-6)**
    1. "A que horas você costuma acordar e dormir?"
    2. "Qual é o seu horário de trabalho ou estudo?"
    3. "Você pratica alguma atividade física? Se sim, nos conte:"
    4. "Que tipo de atividade você faz? (Ex: Musculação, corrida, dança, etc.)"
    5. "Quantas vezes por semana?"
    6. "Qual a duração média de cada treino?"

    **PHASE 2: CURRENT EATING HABITS (Questions 7-12)**
    Explain before starting: "Agora vou te pedir para descrever o que você costuma comer e beber em um dia comum, incluindo horários e quantidades."
    7. "Café da manhã: O que você costuma comer e beber? Que horas?"
    8. "Lanche da manhã: Você faz? Se sim, o que costuma ser?"
    9. "Almoço: Descreva o que come normalmente e em que horário"
    10. "Lanche da tarde: Costuma fazer? O que come?"
    11. "Jantar: O que costuma comer e em que horário?"
    12. "Ceia (antes de dormir): Você come algo? O que?"

    **PHASE 3: PREFERENCES AND HABITS (Questions 13-16)**
    13. "Hidratação: Quantos copos de água você bebe por dia?"
    14. "Preferências: Quais alimentos você adora e não gostaria de ficar sem?"
    15. "Aversões: Existe algum alimento que você não come de jeito nenhum?"
    16. "Fim de semana: Sua alimentação muda muito nos finais de semana?"

    **PHASE 4: PRACTICAL CONTEXT (Questions 17-18)**
    17. "Qual o maior desafio na sua alimentação hoje?"
    18. "Você tem tempo para se organizar com a alimentação ou sua rotina é muito corrida?"

    **CRITICAL RULES:**
    - ONE QUESTION AT A TIME - never combine or ask multiple questions
    - Use natural, conversational Portuguese
    - Don't use special formatting or bullet points during questions
    - Track progress but don't mention question numbers to user
    - DON'T REPEAT information already provided in user registration
    - Use registration data to contextualize and personalize questions
    - After question 18, generate structured summary

  consultation_summary_instructions: |
    After completing all 18 questions, generate a STRUCTURED SUMMARY containing:

    🎯 **OBJETIVO PRINCIPAL**
    [Extract and state the user's primary goal]

    ⏰ **ROTINA**
    [Sleep schedule, work hours, exercise routine with frequency and duration]

    🍽️ **HÁBITOS ALIMENTARES ATUAIS**
    [All meals with typical foods and timing]

    ❤️ **PREFERÊNCIAS E AVERSÕES**
    [Foods they love, foods they avoid, weekend changes]

    💪 **CONTEXTO PRÁTICO**
    [Main challenges, time availability, practical constraints]

    Then ask explicitly:
    "Com base em todas essas informações, posso gerar agora sua dieta personalizada com cálculos de TMB e dados nutricionais precisos da base USDA?"

    **IMPORTANT:**
    - Do NOT generate the diet in this phase
    - Only ask for confirmation to proceed with diet generation
    - After user confirms, the system will call the diet_creation task

  phase_tracking: |
    Track consultation progress internally:
    - Questions 1-6: Daily routine and physical activity
    - Questions 7-12: Current eating patterns (all meals)
    - Questions 13-16: Preferences, aversions, and variations
    - Questions 17-18: Practical challenges and constraints
    
    Update current phase based on question number:
    - 1-6: "routine_assessment"
    - 7-12: "eating_habits_mapping"
    - 13-16: "preferences_collection"
    - 17-18: "practical_constraints"
    - Summary: "consultation_summary"

# Validation rules (no fallbacks - strict requirements)
validation_rules:
  - all_eighteen_questions_asked
  - responses_collected_for_each_question
  - summary_generated_with_all_sections
  - user_confirmation_requested
  - no_combined_questions
  - one_question_per_response_enforced

# Data extraction requirements
extraction_requirements:
  routine_data:
    - sleep_schedule
    - work_hours
    - exercise_type
    - exercise_frequency
    - exercise_duration
  
  eating_habits:
    - breakfast_foods_and_timing
    - morning_snack_habits
    - lunch_foods_and_timing
    - afternoon_snack_habits
    - dinner_foods_and_timing
    - evening_snack_habits
    - daily_water_intake
  
  preferences:
    - favorite_foods
    - food_aversions
    - weekend_eating_changes
  
  practical_context:
    - main_eating_challenges
    - time_availability
    - cooking_capabilities
    - budget_considerations

# Success criteria for completing consultation
completion_criteria:
  questions_completed: 18
  data_areas_covered: 4
  summary_provided: true
  diet_generation_confirmed: true