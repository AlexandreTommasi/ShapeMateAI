  usda_integration_requirements: |
    **USDA API INTEGRATION REQUIREMENTS:**
    
    - All food names in English for API compatibility
    - Fetch real nutritional data per 100g for each food
    - Calculate portions based on caloric targets
    - Store complete nutritional database in JSON
    - Verify data accuracy before including in diet
    
    **ERROR HANDLING:**
    - If food not found in USDA, select alternative
    - Ensure all foods have complete nutritional profiles
    - Validate portion calculations for accuracy
    - Cross-check total daily calories with target

  practical_guidance_generation: |
    **PRACTICAL GUIDANCE BASED ON CONSULTATION:**
    
    Generate personalized guidance covering:
    - Meal timing based on stated routine
    - Preparation tips considering cooking skills
    - Shopping advice considering budget constraints
    - Hydration reminders based on current intake
    - Adaptation strategies for weekend changes
    - Solutions for stated eating challenges
    
    Make recommendations specific to user's:
    - Work schedule and lifestyle
    - Cooking experience level
    - Time availability
    - Budget considerations
    - Food preferences and aversions

# Validation rules for diet creation
validation_rules:
  - verify_tmb_calculation_accuracy
  - validate_macronutrient_percentages
  - confirm_usda_data_integration
  - check_meal_caloric_targets
  - ensure_multiple_options_per_meal
  - validate_json_structure_completeness
  - verify_food_preference_compliance
  - confirm_practical_constraint_consideration

# Success metrics
success_metrics:
  tmb_accuracy: "within_5_percent_of_standard_calculation"
  caloric_distribution: "all_meals_within_7_percent_target"
  macronutrient_balance: "daily_totals_match_calculated_distribution"
  food_variety: "minimum_25_different_foods_weekly"
  option_variety: "minimum_3_options_per_main_meal"
  usda_integration: "100_percent_foods_have_usda_data"
  preference_compliance: "zero_aversion_foods_included"