task_type: "diet_creation"
priority: 3
description: "Generate complete personalized diet using TMB calculations and USDA FoodData Central API with multiple meal options"

# Required context for this task
required_context:
  - consultation_data
  - anthropometric_data
  - food_preferences
  - practical_constraints
  - nutritional_requirements
  - activity_level
  - primary_objective

# Required tools
tools_required:
  - llm_direct
  - usda_api
  - nutrition_calculator
  - json_generator
  - pdf_generator

# Task configurations
max_iterations: 3
timeout_seconds: 300
success_criteria:
  tmb_calculated: true
  macros_distributed: true
  usda_data_integrated: true
  weekly_menu_generated: true
  multiple_options_per_meal: true
  pdf_created: true
  database_saved: true

# Specialized prompts for diet creation
specialized_prompts:
  creation_intro: |
    Generate a complete structured diet plan based on collected consultation data.
    
    **MANDATORY SCIENTIFIC APPROACH:**
    - Calculate precise TMB using Mifflin-St Jeor equation from collected data
    - Apply activity factor based on exercise routine described
    - Adjust calories for stated objective (weight loss/gain/maintenance)
    - Distribute macronutrients according to goal and scientific guidelines
    - Use USDA FoodData Central API for all nutritional values
    
    **USDA API INTEGRATION:**
    - All food names must be in English for USDA compatibility
    - System will automatically fetch precise nutritional data per 100g
    - Calculate portions to meet caloric targets for each meal
    - Ensure macronutrient balance across daily intake
    
    **MEAL PLANNING REQUIREMENTS:**
    - Create 3-5 options for each main meal (breakfast, lunch, dinner)
    - Create 2-3 options for each snack
    - Each option must be within ±7% of meal's caloric target
    - Respect all stated food preferences and aversions
    - Consider practical constraints (time, cooking skills, budget)

  tmb_calculation_instructions: |
    **TMB CALCULATION FROM CONSULTATION DATA:**
    
    Extract from consultation responses:
    - Weight and height (from user profile or consultation answers)
    - Age (from user profile)
    - Gender (from user profile) 
    - Activity level (from exercise questions 3-6)
    - Primary objective (from consultation context)
    
    **FORMULAS:**
    - Men: TMB = 88.362 + (13.397 × weight_kg) + (4.799 × height_cm) - (5.677 × age_years)
    - Women: TMB = 447.593 + (9.247 × weight_kg) + (3.098 × height_cm) - (4.330 × age_years)
    
    **ACTIVITY FACTORS:**
    - No exercise/sedentary: 1.2
    - Light exercise 1-3 days/week: 1.375
    - Moderate exercise 3-5 days/week: 1.55
    - Heavy exercise 6-7 days/week: 1.725
    - Very heavy exercise/physical job: 1.9
    
    **CALORIC ADJUSTMENTS:**
    - Weight loss: GET - 400 kcal
    - Maintenance: GET (no adjustment)
    - Weight gain: GET + 400 kcal

  macronutrient_distribution: |
    **MACRONUTRIENT DISTRIBUTION BY OBJECTIVE:**
    
    **Weight Loss:**
    - Carbohydrates: 40% of total calories
    - Proteins: 30% of total calories  
    - Fats: 30% of total calories
    
    **Maintenance:**
    - Carbohydrates: 50% of total calories
    - Proteins: 20% of total calories
    - Fats: 30% of total calories
    
    **Weight Gain:**
    - Carbohydrates: 55% of total calories
    - Proteins: 25% of total calories
    - Fats: 20% of total calories
    
    **CONVERSION TO GRAMS:**
    - Carbohydrates & Proteins: kcal ÷ 4 = grams
    - Fats: kcal ÷ 9 = grams

  food_selection_strategy: |
    **FOOD SELECTION FROM CONSULTATION DATA:**
    
    Analyze consultation responses to extract:
    - Current foods mentioned in meal descriptions
    - Explicitly stated preferences ("foods I love")
    - Explicitly stated aversions ("foods I don't eat")
    - Practical constraints (time, cooking skills, budget)
    - Cultural/regional preferences from food choices
    
    **SELECTION CRITERIA:**
    - Include preferred foods when nutritionally appropriate
    - Avoid all stated aversions completely
    - Ensure variety across all food groups
    - Consider preparation time based on stated constraints
    - Use English names for USDA API compatibility
    
    **REQUIRED FOOD GROUPS:**
    - Lean proteins (animal and plant-based)
    - Complex carbohydrates
    - Healthy fats
    - Vegetables (variety of colors)
    - Fruits (different types)
    - Dairy or alternatives
    - Legumes and nuts

  meal_options_generation: |
    **MULTIPLE OPTIONS PER MEAL:**
    
    For each meal, create multiple combinations that:
    - Meet the meal's caloric target (±7% tolerance)
    - Provide balanced macronutrients
    - Use different food combinations for variety
    - Respect user preferences and constraints
    
    **MEAL STRUCTURE GUIDELINES:**
    - Breakfast: 3-4 options (dairy/protein + carbs + fruit)
    - Morning snack: 2-3 options (fruit + protein or healthy fat)
    - Lunch: 4-5 options (protein + carbs + vegetables + fat)
    - Afternoon snack: 2-3 options (varied combinations)
    - Dinner: 4-5 options (protein + vegetables + carbs + fat)
    
    **CALORIC DISTRIBUTION:**
    - Breakfast: 25% of daily calories
    - Morning snack: 10% of daily calories
    - Lunch: 35% of daily calories
    - Afternoon snack: 10% of daily calories  
    - Dinner: 20% of daily calories

  json_structure_requirements: |
    **COMPLETE JSON STRUCTURE:**
    
    ```json
